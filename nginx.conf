server {
    # Cloud Run 은 기본적으로 컨테이너의 8080 포트로 트래픽을 보냅니다.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    # gzip 압축 (HTML/CSS/JS/SVG)
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # 실제 파일만 제공: 없는 정책/자산 주소에 홈페이지를 반환하지 않는다.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # 파일 이름을 유지하는 디자인 자산은 배포 시 재검증한다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # 이미지: 장기 캐시
    location /IMG/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # HTML: 캐시하지 않음 (배포 시 즉시 반영)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SEO: 검색엔진이 최신 내용을 자주 받아가도록 짧은 캐시
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }
}
